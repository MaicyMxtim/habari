[project]
name = "habari"
version = "0.1.0"
description = "Swahili news classification with modern and classical NLP"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
