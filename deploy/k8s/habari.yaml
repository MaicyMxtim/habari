apiVersion: v1
kind: Namespace
metadata:
  name: habari
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habari-serve
  namespace: habari
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habari-serve
  template:
    metadata:
      labels:
        app: habari-serve
    spec:
      containers:
        - name: serve
          image: habari-serve:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: habari-serve
  namespace: habari
  labels:
    app: habari-serve
spec:
  selector:
    app: habari-serve
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: habari-serve
  namespace: habari
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: habari-serve
  endpoints:
    - port: ""
      targetPort: 8000
